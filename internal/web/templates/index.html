<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WB Sellers</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#171a21; --field:#0b0d12; --fg:#e6e6e6; --muted:#8b93a7; --accent:#4f8cff; --ok:#3ccf7a; --err:#ff5f6d; --warn:#ffb648; --border:#262b36; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width: 820px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  textarea, input[type=number] { width:100%; background:var(--field); color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:10px; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  textarea { min-height: 160px; resize: vertical; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:14px; }
  .modes { display:flex; gap:18px; flex-wrap:wrap; }
  .modes label { display:flex; align-items:center; gap:6px; color:var(--fg); margin:0; font-size:14px; }
  button { border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  button.secondary { background:#2a3040; }
  button:disabled { opacity:.45; cursor:default; }
  .bar { height:8px; background:var(--field); border-radius:999px; overflow:hidden; margin:12px 0 8px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition: width .3s; }
  .status { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:13px; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; background:#20242e; color:var(--muted); }
  .badge.run { background:#1d2a44; color:var(--accent); }
  .badge.ok { background:#13301f; color:var(--ok); }
  .badge.err { background:#3a1a1e; color:var(--err); }
  .msg { margin-top:10px; font-size:13px; }
  .msg.err { color:var(--err); } .msg.warn { color:var(--warn); }
  a.dl { color:var(--accent); text-decoration:none; font-weight:600; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>WB Sellers</h1>
  <p class="sub">Юридические данные продавцов Wildberries по списку supplierId{{if .HasSearch}} или по поисковым запросам{{end}}.</p>

  <form class="card" id="form">
    <div class="modes">
      <label><input type="radio" name="mode" value="ids" checked> Список supplierId или ссылок на продавца</label>
      {{if .HasSearch}}<label><input type="radio" name="mode" value="queries"> Поисковые запросы</label>{{end}}
    </div>
    <div style="margin-top:16px">
      <label for="input">По одному на строку, строки с # игнорируются. Можно вставить CSV из wb-search целиком: возьмётся колонка supplier_id</label>
      <textarea id="input" name="input" placeholder="1&#10;https://www.wildberries.ru/seller/12345"></textarea>
    </div>
    <div class="row">
      <label for="limit" style="margin:0">Хватит продавцов (0 = все)</label>
      <input type="number" id="limit" name="limit" value="0" min="0" style="width:90px">
      {{if .HasSearch}}
      <span id="pagesRow" hidden>
        <label for="pages" style="margin:0 0 0 12px;display:inline">Страниц на запрос</label>
        <input type="number" id="pages" name="pages" value="3" min="1" max="50" style="width:90px">
      </span>
      {{end}}
    </div>
    <div class="row">
      <button type="submit" id="start">Запустить</button>
      <button type="button" class="secondary" id="cancel" disabled>Остановить</button>
    </div>
  </form>

  <section class="card">
    <div class="status"><span id="badge" class="badge">нет задач</span><span id="counter" class="num"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <div class="status"><span id="message"></span><span id="elapsed" class="num"></span></div>
    <div id="error" class="msg err" hidden></div>
    <div id="warning" class="msg warn" hidden></div>
    <div id="result" class="msg" hidden>Продавцов: <b id="sellers" class="num"></b>. <a class="dl" href="/download">Скачать CSV</a></div>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const form = $('form'), start = $('start'), cancel = $('cancel'), pagesRow = $('pagesRow');

  form.addEventListener('change', e => {
    if (e.target.name === 'mode' && pagesRow) pagesRow.hidden = e.target.value !== 'queries';
  });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    start.disabled = true;
    const r = await fetch('/api/start', { method: 'POST', body: new URLSearchParams(new FormData(form)) });
    if (!r.ok) { alert(await r.text()); start.disabled = false; }
  });
  cancel.addEventListener('click', () => fetch('/api/cancel', { method: 'POST' }));

  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  let startedAt = null;
  setInterval(() => { if (startedAt) $('elapsed').textContent = fmt(Math.round((Date.now() - startedAt) / 1000)); }, 1000);

  function render(st) {
    start.disabled = st.running;
    cancel.disabled = !st.running;
    const badge = $('badge');
    if (!st.id) { badge.textContent = 'нет задач'; badge.className = 'badge'; }
    else if (st.running) { badge.textContent = 'выполняется'; badge.className = 'badge run'; }
    else if (st.stage === 'cancelled') { badge.textContent = 'остановлено'; badge.className = 'badge'; }
    else if (st.error) { badge.textContent = 'ошибка'; badge.className = 'badge err'; }
    else { badge.textContent = 'готово'; badge.className = 'badge ok'; }

    const pct = st.total ? Math.round(st.done / st.total * 100) : (st.stage === 'done' ? 100 : 0);
    $('bar').style.width = pct + '%';
    $('counter').textContent = st.total ? `${st.done} / ${st.total}` : (st.done ? String(st.done) : '');
    $('message').textContent = st.message || '';
    $('error').hidden = !st.error; $('error').textContent = st.error || '';
    $('warning').hidden = !st.warning; $('warning').textContent = st.warning || '';
    $('result').hidden = st.running || !st.sellers; $('sellers').textContent = st.sellers || 0;

    startedAt = st.running ? new Date(st.startedAt).getTime() : null;
    if (!st.id) $('elapsed').textContent = '';
    else if (!st.running && st.finishedAt) $('elapsed').textContent = fmt(Math.round((new Date(st.finishedAt) - new Date(st.startedAt)) / 1000));
  }

  const es = new EventSource('/events');
  es.onmessage = e => render(JSON.parse(e.data));
  es.onerror = () => { $('message').textContent = 'нет связи с сервером, переподключаюсь'; };
})();
</script>
</body>
</html>
