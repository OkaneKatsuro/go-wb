# go-wb на сервере. Оба сервиса одноразовые (profiles: cli), запускаются через
# `docker compose run`, постоянного процесса нет. Данные, кэш и выгрузки — в ./data.
#
# Шаг 1, search — поиск в браузере (образ browser: Chromium + Xvfb). Ключей у этого
# контейнера нет намеренно: браузер рисует чужой сайт, ему нечего знать про CRM.
#   docker compose run --rm search \
#     wb-sellers -q "кроссовки мужские" -q "кроссовки женские" -limit 300 -search-only -ids-out /data/ids.txt
#   один запрос с товарами в CSV:
#   docker compose run --rm search wb-search -q "кроссовки мужские" -pages 3 -out /data/wb.csv
#
# Шаг 2, import — юрданные, OFData и заливка в CRM по найденным id (ключи только здесь):
#   docker compose run --rm import \
#     sh -c 'wb-sellers -ids /data/ids.txt -enrich -enrich-ip -cache /data/cache.json \
#              -format ndjson -out - | wb-crm'
#   только заливка готовой выгрузки:
#   docker compose run --rm import wb-crm -in /data/sellers.ndjson
services:
  search:
    image: go-wb-browser:latest
    build:
      context: .
      target: browser
    volumes:
      - ./data:/data
    profiles: ["cli"]

  import:
    image: go-wb:latest
    build:
      context: .
      target: slim
    env_file: .env          # OFDATA_KEY, TWENTY_API_URL, TWENTY_API_KEY
    volumes:
      - ./data:/data
    profiles: ["cli"]
